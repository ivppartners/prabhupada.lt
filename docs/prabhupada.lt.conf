server {
    server_name prabhupada.lt www.prabhupada.lt;
    root /var/www/prabhupada.lt;
    index index.html;

    # Paslepiame Nginx versiją
    server_tokens off;

    # Saugumo HTTP antraštės (taikomos ir statiniams failams, ir API)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/prabhupada_access.log;
    error_log /var/log/nginx/prabhupada_error.log;

    # Viešajame domene failų įkėlimai nevykdomi – ribojame užklausos dydį iki 1MB
    client_max_body_size 1M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Administracinių /api/* maršrutų prieigos kontrolę pagal tikrąjį IP vykdo Node.js (routes.js)
    location /api {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Perduodame tikrą IP adresą aplikacijai (būtina requireLocalNetwork patikrai)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/prabhupada.lt/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/prabhupada.lt/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.prabhupada.lt) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = prabhupada.lt) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name prabhupada.lt www.prabhupada.lt;
    server_tokens off;
    return 404; # managed by Certbot
}
