server {
    listen 80;
    server_name prabhupada.admin;
    root /var/www/prabhupada.admin;
    index index.html;

    # Paslepiame Nginx versiją
    server_tokens off;

    # Saugumo HTTP antraštės
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # KRITINĖ APSAUGA: leidžiame prieigą prie prabhupada.admin tik iš vietinio tinklo
    # (apsaugo nuo Host: prabhupada.admin antraštės klastojimo iš interneto)
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    deny all;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Padidiname upload limitą, nes keliate MP3 failus
    client_max_body_size 500M;

    location /api {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Perduodame tikrą IP adresą aplikacijai
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
